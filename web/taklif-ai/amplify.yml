version: "1.0"
frontend:
  phases:
    preBuild:
      commands:
        - npm install              # Install the required dependencies
    build:
      commands:
        - npm run build            # Build the Next.js app
  artifacts:
    baseDirectory: "out"  # Specify the output directory from the build
    files:
      - "**/*"                      # Include all files in the output
  cache:
    paths:
      - "node_modules/**/*"  # Cache node_modules to speed up builds

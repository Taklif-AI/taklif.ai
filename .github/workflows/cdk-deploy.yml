name: CI/CD - CDK Deploy Workflow

on:
  push:
    branches:
      - 'develop'
  pull_request:
    types:
      - closed
  workflow_dispatch:  # run this workflow manually from the Actions tab (works only on the default branch)

env:
  CDK_VERSION: 2.166.0

jobs:
  deploy:
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.18'          

      - name: Install infrastructure dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infrastructure/requirements.txt

      - name: Install AWS CDK
        run: npm install -g aws-cdk@$CDK_VERSION
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@master
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.CDK_DEFAULT_REGION }}
      
      - name: Process lambda layers
        working-directory: infrastructure
        run: |
          for layer_dir in layers/*; do
            if [ -d "$layer_dir" ]; then
              if [ -f "$layer_dir/requirements.txt" ]; then
                echo "Processing Python dependencies in $layer_dir..."
                python_dir="$layer_dir/python"
                mkdir -p "$python_dir"
                pip install --target="$python_dir" -r "$layer_dir/requirements.txt"
                echo "Removing *.dist-info files in $python_dir"
                find "$python_dir" -type d -name "*.dist-info" -exec rm -rf {} +
              elif [ -f "$layer_dir/package.json" ]; then
                echo "Processing Node.js dependencies in $layer_dir..."
                cd "$layer_dir"
                npm install
                cd "../.."
                nodejs_dir="$layer_dir/nodejs"
                mkdir -p "$nodejs_dir"
                mv "$layer_dir/node_modules" "$nodejs_dir"
                mv "$layer_dir/package.json" "$nodejs_dir"
                mv "$layer_dir/package-lock.json" "$nodejs_dir"
              else
                echo "Skipping $layer_dir: No valid setup found."
              fi
            fi
          done

      - name: Deploy to Development
        if: |
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, 'refs/heads/feature/') 
        env: 
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cdk deploy InfrastructureStackDev --require-approval never
        working-directory: infrastructure

      # Deploy to the Production stack if merging into main
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
        run: |
          cdk deploy InfrastructureStackProd --require-approval never
        working-directory: infrastructure